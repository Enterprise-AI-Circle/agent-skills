---
layout: default
---
<header class="page-header">
  <p class="eyebrow">Blog · {{ page.date | date: "%d. %B %Y" }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="subtitle">{{ page.description }}</p>{% endif %}
</header>
<article class="prose">
  {{ content }}
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← Alle Beiträge</a></p>
</article>
